<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Page of Netflix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
                * {
            padding: 0;
            margin: 0;
        }

        body {
            color: white;
            background-color: black;
        }

        .backimg{
            padding: 4rem 0 4rem 0;
            background-image: url(assets/imgs/Netflix-Hintergrund.webp);
            background-size: cover;
            opacity: 0.8;
            
        }

        .main {
            
            max-width: 400px;
            /* height: 70px; */
            margin: auto;
            display: flex;
            justify-content: center;
            justify-content: space-between;
            /* align-items: center; */
            flex-direction: column;
            gap: 2rem;
            border: 1px solid white;
            padding: 4rem;
            background-color: #000;
            opacity: 0.8;
        }
        .main img {
            color: red;
            width: 100px;
            margin-top: 1rem;
            opacity: 0.8;
        }
        .main> :nth-child(2){
            font-size: 1.8rem;
        }
        .main> :nth-child(4){
            text-align: center;
            font-size: 1.2rem;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        form input{
            height: 50px;
            color: #050505;
            padding-left: 0.8rem;
            background-color: ;
            opacity: 0.8;
            border-radius: 5px;
            border: 2px solid white;
        }

        form button{
            height: 35px;
            color: white;
            font-size: 1rem;
            padding-left: 0.8rem;
            background-color: red;
            border-radius: 5px;
            border: none;
        }

        form span{
            text-align: center;
        }
        form> :nth-child(5){
            color: #000;
            background-color: gainsboro;
        }
        footer span{
            padding: 20px;
            margin: 0;
            display: block;
            text-align: center;
        }
        .footer{
            color: white;
            max-width: 70vw;
            margin: auto;
            padding: 34px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }

        .footer-items{
            display: flex;
            flex-direction: column;
            gap: 23px;
        }
        .footer-items a{
            text-decoration: none;
            color: white;
        }
        .seperation {
            height: 3px;
            background-color: gray;
        }

        .showpass{
            /* border: 1px solid wheat; */
            object-fit: ;
            position: relative;
            /* position: absolute; */
            /* display: none; */
        }
        .showpass i{
            color: #2d2929;
            /* background-color: #000; */
            border-radius: 50%;
            position: absolute;
            bottom: 35%;
            left: 90%;
            font-size: 1rem;
            /* border: 1px solid black; */
        }
        .showpass input{
            width: 96%;
        }

        .showpass .hide{
            display: none;
        }


    </style>
</head>
<body>
     <div class="backimg">
        <div class="main">
            <span><img src="assets/imgs/logo.svg" alt="" width="100"></span>
            <span>SIGN IN</span>
            <form action="">
                <input type="email" placeholder="Email or mobile number" required>
                
                <div class="showpass">
                    <input id="input" type="password" placeholder="password  " required>
                    <div class="icon">
                        <i class="fa-solid fa-eye"></i>
                        <i class="fa-solid fa-eye-slash hide"></i>
                    </div>
                    
                </div>
                <button>Sign In</button>
                <span>OR</span>
                <button>Use a Sign-in code</button>
            </form>
            <span><a href="" style="color: aliceblue;">Forgot password?</a></span>
            <div>
                <input type="checkbox">
                <span>Remember me</span>
            </div>
            <span>New to Netflix? Sign up now.</span>
            <p>This page is protected by Google reCAPTCHA to ensure you're not a bot. <a href="">Learn more.</a></p>
     </div>
     </div>
     <br>
     <div class="seperation"></div>
     <footer>
        <footer>
            <span>Questions? Call 000-800-919-1694</span>
            <div class="footer">
            <div class="footer-items">
                <a href="">Faq</a>
                <a href="">Invester Relations</a>
            </div>
            <div class="footer-items">
                <a href="">Help Centre</a>
                <a href="">Media Centre</a>
            </div>
            <div class="footer-items">
                <a href="">Faq</a>
                <a href="">Invester Relations</a>
            </div>
            <div class="footer-items">
                <a href="">Help Centre</a>
                <a href="">Media Centre</a>
            </div>
            </div>
        </footer>
     </footer>

     <script src="netflix.js"></script>
            
</body>
</html>
